[package]
name        = "mcpp-ide-testsupport"
version     = "0.1.0"
description = "What every backend test of mcpp-ide shares: a check that ends its case where it failed (mtest), and the paths of the fixtures and the built programs"
license     = "Apache-2.0"

[language]
standard   = "c++23"
modules    = true
import_std = true

[targets.mcpp-ide-testsupport]
kind = "lib"

[dependencies]
mcpplibs.mtest = "0.5.2"
