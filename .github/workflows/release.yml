name: Release

# A release: CI on the commit (which builds every system's backend and both editor packages carrying
# them), then a GitHub release with the packages, the backends and their checksums. The two
# Marketplaces are uploaded to by the maintainer, from those assets.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' mcpp.toml | head -1)"
          mkdir -p dist
          cp artifacts/mcpp-vscode-vsix/*.vsix artifacts/mcpp-clion-zip/*.zip dist/
          for d in artifacts/backend-*; do
            platform="${d#artifacts/backend-}"
            chmod +x "$d/$platform"/* || true
            tar -czf "dist/mcpp-ide-${version}-${platform}.tar.gz" -C "$d/$platform" .
          done
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release create "v${version}" dist/* --target "$GITHUB_SHA" --title "mcpp-ide ${version}" --notes-file CHANGELOG.md
