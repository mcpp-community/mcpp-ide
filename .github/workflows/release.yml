name: Recover Open VSX 0.2.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-openvsx-0.2.0
  cancel-in-progress: false

jobs:
  publish-existing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify the already published VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/mcpp-community/mcpp-ide/git/ref/tags/v0.2.0 --jq .object.sha)" = 421613a98e1868fc295262a67f322e49c6f90a99
          gh release download v0.2.0 -R mcpp-community/mcpp-ide -p mcpp-vscode-1.1.0.vsix -p SHA256SUMS -D published
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('published')
          name = 'mcpp-vscode-1.1.0.vsix'
          wanted = '7383a9f21565685a0a15cd2ea49dac5dbfa2ed479e5db412986b7c81bb880034'
          entries = dict(line.split(None, 1)[::-1] for line in (root / 'SHA256SUMS').read_text().splitlines())
          assert entries[name] == wanted
          assert hashlib.sha256((root / name).read_bytes()).hexdigest() == wanted
          print('Existing public VSIX and SHA256SUMS match the reviewed release bytes')
          PY
      - name: Publish the existing release file to Open VSX
        shell: bash
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${OPENVSX_TOKEN:-}" || { echo 'OPENVSX_TOKEN is required'; exit 1; }
          (cd mide-plugins/vscode && npm ci --ignore-scripts)
          (cd mide-plugins/vscode && npx --no-install ovsx publish "$GITHUB_WORKSPACE/published/mcpp-vscode-1.1.0.vsix" --pat "$OPENVSX_TOKEN")
