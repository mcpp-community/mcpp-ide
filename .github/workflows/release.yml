name: Publish released CLion 0.2.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetbrains-mcpp-ide-0.2.0
  cancel-in-progress: false

jobs:
  publish-existing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the immutable GitHub release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/mcpp-community/mcpp-ide/git/ref/tags/v0.2.0 --jq .object.sha)" = 421613a98e1868fc295262a67f322e49c6f90a99
          gh release download v0.2.0 -R mcpp-community/mcpp-ide -p mcpp-clion-0.2.0.zip -p SHA256SUMS -D published
          (cd published && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Submit the verified existing plugin update
        shell: bash
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish-jetbrains.py --archive published/mcpp-clion-0.2.0.zip \
            --xml-id io.github.mcpp-community.mcpp-clion --version 0.2.0 \
            --sha256 6daccbaa5b52eb30c784da4ebc14fdaa333d6a769e00e4707b9ac74f8b6a3c8b \
            --output published/jetbrains-receipt.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: jetbrains-mcpp-ide-0.2.0-receipt
          path: published/jetbrains-receipt.json
          if-no-files-found: warn
