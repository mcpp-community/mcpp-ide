name: Release

# A release: CI on the commit (which builds the backend's ok-image bundle, its universal package with
# every system's okrun, and both editor packages carrying the bundle), then a GitHub release with the
# editor packages, the bundle, the universal package and their checksums. Open VSX and
# JetBrains consume the exact published archives independently after that release exists.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' mcpp.toml | head -1)"
          mkdir -p dist
          cp artifacts/mcpp-vscode-vsix/*.vsix artifacts/mcpp-clion-zip/*.zip dist/
          cp artifacts/backend/mcpp-ide.okb "dist/mcpp-ide-${version}.okb"
          cp "artifacts/backend/mcpp-ide-${version}"-openkal*.tar.gz dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release create "v${version}" dist/* --target "$GITHUB_SHA" --title "mcpp-ide ${version}" --notes-file CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

  openvsx:
    needs: release
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download and verify the published VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" -p 'mcpp-vscode-*.vsix' -p SHA256SUMS -D published
          (cd published && sha256sum -c --ignore-missing SHA256SUMS)
      - name: Publish to Open VSX
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPENVSX_TOKEN:-}" ]; then
            echo "OPENVSX_TOKEN is not set: Open VSX is a required destination of a release."
            echo "Create a token with the publish scope at open-vsx.org (Settings, Access Tokens) and add it"
            echo "as the OPENVSX_TOKEN secret of this repository (Settings, Secrets and variables, Actions)."
            exit 1
          fi
          (cd mide-plugins/vscode && npm ci --ignore-scripts)
          vsix="$(ls published/mcpp-vscode-*.vsix)"
          (cd mide-plugins/vscode && npx ovsx publish "$GITHUB_WORKSPACE/$vsix" --pat "$OPENVSX_TOKEN")

  jetbrains:
    needs: release
    uses: ./.github/workflows/publish-jetbrains.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
