name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  # The backend on each system the editors run on: build every program (the backend, the mock mcpp,
  # the dev tool), run the tests -- the protocol against its schema and the fixtures against mcpp's
  # contract among them -- check the translations, then build the release program the editor
  # packages carry, laid out bin/<platform>/.
  #
  # When mcpp's platforms ship (mcpp design 2026-10-28), the release program becomes one ok image per
  # architecture (`--target <arch>-openkal`) made into a program of each system by
  # `mcpp pack --mode self-contained`; only the last two steps change, not the layout they upload.
  backend:
    name: backend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `releases`: the release programs a leg builds, as `<platform>=<target>` (empty target: this
        # system). The arm64 Linux program is cross-built on x86_64, where musl-gcc's cross payload is.
        include:
          - { os: ubuntu-24.04, platform: linux-x64, llvm: 'false', releases: 'linux-x64=x86_64-linux-musl linux-arm64=aarch64-linux-musl' }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, llvm: 'false', releases: '' }
          - { os: macos-14, platform: darwin-arm64, llvm: 'true', releases: 'darwin-arm64=' }
          - { os: windows-2022, platform: win32-x64, llvm: 'true', releases: 'win32-x64=' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mcpp
        with:
          llvm: ${{ matrix.llvm }}
      - name: Build
        run: mcpp build
      - name: Test
        run: mcpp test
      - name: Every string has its translation
        run: mcpp run mcpp-ide-dev -- check-i18n
      - name: Release programs
        if: matrix.releases != ''
        run: |
          set -euo pipefail
          for entry in ${{ matrix.releases }}; do
            platform="${entry%%=*}" target="${entry#*=}"
            case "$platform" in win32-*) exe=mcpp-ide.exe ;; *) exe=mcpp-ide ;; esac
            if [ -n "$target" ]; then
              mcpp build --release --target "$target"
              built="$(ls -t target/"$target"/*/bin/$exe | head -1)"
            else
              mcpp build --release
              built="$(ls -t target/*/*/bin/$exe | head -1)"
            fi
            mkdir -p "out/$platform"
            cp "$built" "out/$platform/"
            file "out/$platform/$exe" 2>/dev/null || true
          done
          case "${{ matrix.platform }}" in win32-*) out/win32-x64/mcpp-ide.exe --version ;; *) "out/${{ matrix.platform }}/mcpp-ide" --version ;; esac
      - uses: actions/upload-artifact@v5
        if: matrix.releases != ''
        with:
          name: backend-${{ matrix.platform }}
          path: out

  # The VS Code extension: unit tests (the wire, the mappings) and the shared panels in a DOM, both
  # against the backend built here; the extension in a real VS Code (the oldest it supports) over the
  # mock mcpp; then the package carrying every system's backend, and its file list.
  vscode:
    name: VS Code extension
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mcpp
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/download-artifact@v5
        with:
          pattern: backend-*
          path: backends
          merge-multiple: true
      - name: Build the backend and its test programs
        run: |
          chmod +x backends/*/mcpp-ide*
          mcpp build
      - name: Install
        working-directory: vscode
        run: npm ci
      - name: Unit and panel tests
        working-directory: vscode
        run: npm test
      - name: The panels type-check
        working-directory: vscode
        run: npm run check:webui
      - name: The extension in VS Code ${{ env.VSCODE_VERSION }}
        working-directory: vscode
        run: MCPP_IDE_BACKENDS="$GITHUB_WORKSPACE/backends" xvfb-run -a npm run test:e2e
      - name: Package
        working-directory: vscode
        run: |
          MCPP_IDE_BACKENDS="$GITHUB_WORKSPACE/backends" npm run package
          (cd dist/extension && npx vsce ls --no-dependencies) | tee files.txt
          for p in linux-x64 linux-arm64 darwin-arm64; do grep -qx "bin/$p/mcpp-ide" files.txt; done
          grep -qx "bin/win32-x64/mcpp-ide.exe" files.txt
      - uses: actions/upload-artifact@v5
        with:
          name: mcpp-vscode-vsix
          path: vscode/dist/*.vsix

  # The CLion plugin: its tests (the wire and a session over the mock mcpp), the archive carrying
  # every system's backend, and the Plugin Verifier against the oldest CLion it claims (2025.2) and
  # the one it is built on.
  jetbrains:
    name: CLion plugin
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-mcpp
      - name: Gradle (xim:gradle brings its JDK)
        run: xlings install gradle -y -g
      - uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-clion-${{ hashFiles('jetbrains/gradle.properties', 'jetbrains/build.gradle.kts', 'jetbrains/settings.gradle.kts') }}
      - uses: actions/download-artifact@v5
        with:
          pattern: backend-*
          path: backends
          merge-multiple: true
      - name: Build the backend and its test programs
        run: |
          chmod +x backends/*/mcpp-ide*
          mcpp build
          # Every Gradle run of this job packages the same plugin: the variables hold for all of them.
          bin="$(cd "$(dirname "$(ls -t target/*/*/bin/mcpp-ide | head -1)")" && pwd)"
          {
            echo "MCPP_IDE_DEV=$bin/mcpp-ide-dev"
            echo "MCPP_IDE_BACKEND=$bin/mcpp-ide"
            echo "MCPP_IDE_MOCK_MCPP=$bin/mcpp-ide-mock-mcpp"
            echo "MCPP_IDE_BACKENDS=$GITHUB_WORKSPACE/backends"
          } >> "$GITHUB_ENV"
      - name: Test and package
        working-directory: jetbrains
        run: gradle --no-daemon test buildPlugin
      - name: Plugin Verifier
        working-directory: jetbrains
        run: gradle --no-daemon verifyPlugin
      - name: The archive carries every system's backend
        working-directory: jetbrains
        run: |
          unzip -l build/distributions/mcpp-clion-*.zip | tee files.txt
          for p in linux-x64/mcpp-ide linux-arm64/mcpp-ide darwin-arm64/mcpp-ide win32-x64/mcpp-ide.exe; do grep -q "mcpp-clion/bin/$p" files.txt; done
      - uses: actions/upload-artifact@v5
        with:
          name: mcpp-clion-zip
          path: jetbrains/build/distributions/*.zip

  # Both packages, opened on every system they serve: what each carries of the backend for that
  # system starts (scripts/check-package.sh -- the ok-image bundle and its okrun once they are built).
  packages:
    name: packages on ${{ matrix.os }}
    needs: [vscode, jetbrains]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: mcpp-*
          path: packages
          merge-multiple: true
      - name: The VS Code extension
        run: .github/scripts/check-package.sh packages/mcpp-vscode-*.vsix extension
      - name: The CLion plugin
        run: .github/scripts/check-package.sh packages/mcpp-clion-*.zip mcpp-clion
