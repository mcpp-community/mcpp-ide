name: Task
description: Maintenance, refactoring, CI, documentation or a release
labels: [task]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [refactor, perf, test, docs, ci, chore, release]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The criteria that close this task.
