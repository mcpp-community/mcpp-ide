name: Set up mcpp
description: Install xlings, the pinned mcpp and (for macOS and Windows targets) the pinned LLVM, with the package store cached.
inputs:
  llvm:
    description: Install LLVM and make it mcpp's default toolchain.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Version pins
      shell: bash
      run: |
        set -euo pipefail
        while IFS='=' read -r name value; do
          case "$name" in ''|\#*) continue ;; esac
          if [ -z "${!name:-}" ]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
        done < .github/versions.env
    - name: Install xlings (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
          https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
          | bash -s "$XLINGS_VERSION"
        echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
    - name: Install xlings (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        irm https://d2learn.org/xlings-install.ps1.txt | iex
        "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Cache the mcpp package store
      uses: actions/cache@v5
      with:
        path: ~/.mcpp/registry/data/xpkgs
        key: mcpp-xpkgs-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml', 'mcpp.lock') }}
        restore-keys: mcpp-xpkgs-${{ runner.os }}-${{ runner.arch }}-${{ env.MCPP_VERSION }}-
    - name: Install mcpp
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3 4 5; do
          xlings update > /dev/null 2>&1 || true
          if xlings install "mcpp@$MCPP_VERSION" -y -g; then break; fi
          [ "$attempt" = 5 ] && { echo "::error::mcpp@$MCPP_VERSION could not be installed"; exit 1; }
          sleep 30
        done
        mcpp --version
        mcpp self config --mirror GLOBAL
    - name: Install LLVM
      if: inputs.llvm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if mcpp toolchain install llvm "$LLVM_VERSION"; then break; fi
          [ "$attempt" = 3 ] && exit 1
          sleep 30
        done
        mcpp toolchain default "llvm@$LLVM_VERSION"
