# mcpp-ide: the IDE backend for mcpp (one C++ program, `mcpp-ide serve`, JSON-RPC
# on its standard streams), the shared panels, and the editor adapters that host
# it (vscode/, jetbrains/). This file builds the backend.
#
# The operating system is reached through mcpplibs.os (processes, the
# environment, the standard streams, a request to end), which is openkal
# beneath: the backend names no system header and no platform macro, and the
# same source builds for a system (M1) and as an ok image (`<arch>-openkal`,
# M2/M3), where the system it runs upon is answered when the image is loaded.
[package]
name        = "mcpp-ide"
version     = "0.1.0"
description = "The IDE backend for mcpp: sessions, jobs, records and view models over mcpp's control contract"
license     = "Apache-2.0"
authors     = ["mcpp-community"]
repo        = "https://github.com/mcpp-community/mcpp-ide"
mcpp        = ">=2026.10.26.1"

[language]
standard   = "c++23"
modules    = true
import_std = true

[build]
sources = ["src/*.cppm"]
macos_deployment_target = "12.0"

[targets.mcpp-ide]
kind = "bin"
main = "src/main.cpp"

# Stands in for mcpp in the tests: answers the control contract from the
# golden fixtures under protocol/fixtures.
[targets.mcpp-ide-mock-mcpp]
kind = "bin"
main = "src/bin/mockmcpp.cpp"

[dependencies]
os = "0.2.0"

[dependencies.nlohmann]
json = "3.12.0"
