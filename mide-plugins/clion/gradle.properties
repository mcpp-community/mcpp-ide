# The CLion build the plugin is compiled and tested against. sinceBuild in build.gradle.kts gates
# where it installs (2026.1 and later); the verifier checks both ends.
platformType = CL
platformVersion = 2026.2.3
pluginVersion = 0.2.0
# The mcppls CLion plugin this one depends on (<depends>io.github.sunrisepeak.mcppls</depends>):
# this machine's package of the release, fetched for the sandbox, the tests and the verifier.
mcpplsPluginVersion = 0.0.19
org.gradle.jvmargs = -Xmx2g
# The IDE ships the Kotlin standard library; a plugin bundles no second copy.
kotlin.stdlib.default.dependency = false
