<!DOCTYPE html>
<html lang="library.htmlLang">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src vscode-webview://parity; script-src 'nonce-parity-nonce'; img-src vscode-webview://parity">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="vscode-webview://parity/media/page.css">
<title>library.title</title>
</head>
<body>
<header class="sr-only">
  <h1 class="panel-title">library.title</h1>
</header>
<div class="toolbar">
  <label class="search-label" for="library-search"><span class="sr-only">library.search</span></label>
  <input id="library-search" type="text" role="searchbox" class="search" autocomplete="off" spellcheck="false" placeholder="library.search" aria-label="library.search" value="">
  <button class="link-button clear-search" type="button" data-action="clear" aria-label="library.clear" hidden>×</button>
  <label class="network-toggle" title="library.networkSearch.hint">
    <input id="library-network" type="checkbox" data-setting="mcpp.library.networkSearch">
    <span>library.networkSearch</span>
  </label>
  <span class="count" id="library-count">library.count</span>
</div>
<main>
<div id="library-results">
    
    <ul id="library-list" class="rows"><li class="row-item">
  <button type="button" class="row" data-row="mcpp-index:nlohmann.json" data-id="nlohmann.json" data-cross="false" data-namespace="nlohmann" data-added="true" data-surfaces="header module" data-haystack="nlohmann json json for modern c++" title="library.open">
    <span class="row-head">
      <span class="row-name">nlohmann.json</span>
      <span class="row-version" title="3.12.0">library.version.latest</span>
    </span>
    <span class="row-meta"><span class="row-surface" data-surface="header">#include</span><span class="badge badge-added" data-badge="added">library.added</span><span class="badge" data-badge="cross">mcpp-index</span></span>
    <span class="row-description" title="JSON for Modern C++">JSON for Modern C++</span>
  </button>
</li>
<li class="row-item">
  <button type="button" class="row" data-row="mcpp-index:compat.zlib" data-id="compat.zlib" data-cross="false" data-namespace="compat" data-added="false" data-surfaces="header" data-haystack="compat zlib compression" title="library.open">
    <span class="row-head">
      <span class="row-name">compat.zlib</span>
      <span class="row-version" title="1.3.2">library.version.latest</span>
    </span>
    <span class="row-meta"><span class="row-surface" data-surface="header">#include</span><span class="badge" data-badge="cross">mcpp-index</span></span>
    <span class="row-description" title="A compression library">A compression library</span>
  </button>
</li>
<li class="row-item">
  <button type="button" class="row" data-row="mcpp-index:broken.pkg" data-id="broken.pkg" data-cross="false" data-namespace="" data-added="false" data-surfaces="" data-haystack="broken pkg" title="library.open">
    <span class="row-head">
      <span class="row-name">broken.pkg</span>
      
    </span>
    <span class="row-meta"><span class="badge badge-warn" data-badge="unreadable">library.unreadable</span></span>
  </button>
</li></ul>
    <section id="library-extra" hidden>
      <h2 class="group-title">library.other (0)</h2>
      <ul class="rows"></ul>
    </section>
    <p id="library-empty" class="empty" hidden>library.noResults</p>
    <p class="search-status" role="status"></p>
  </div>
</main>
<footer id="library-footer" class="footer" role="note">
  <details><summary>the local mcpp-index</summary><p class="source">/home/user/.mcpp/registry/data/mcpp-index</p></details>
  <div class="footer-actions">
  <button type="button" class="link-button" data-action="update">library.update</button>
  <button type="button" class="link-button" data-action="settings">library.settings</button>
  <button type="button" class="link-button" data-action="output">library.output</button>
  <button type="button" class="link-button" data-action="refresh" title="library.refresh">library.refresh</button>
  </div>
</footer>
<script nonce="parity-nonce">
(function () {
  "use strict";
  var api = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : undefined;
  var state = {"countTemplate":"{0} of {1}","selectedKey":"mcpp-index:nlohmann.json","total":3,"localTotal":3,"query":""};
  var saved = api && api.getState ? api.getState() || {} : {};
  var searchInput = document.getElementById("library-search");
  var networkInput = document.getElementById("library-network");
  var networkToken;
  var networkSequence = 0;
  var selected = state.selectedKey || saved.selected || "";
  if (searchInput && typeof saved.query === "string") { searchInput.value = saved.query; }
  function post(message) { if (api) { api.postMessage(message); } }
  function persist() {
    if (api && api.setState) { api.setState({ query: searchInput.value, selected: selected, scroll: window.scrollY }); }
  }
  function apply() {
    document.querySelector('[data-action="clear"]').hidden = searchInput.value.length === 0;
    var query = searchInput.value.trim().toLowerCase();
    var parts = query.split(/\s+/);
    var rows = Array.from(document.querySelectorAll("[data-row]"));
    var local = 0;
    var extra = 0;
    rows.forEach(function (row) {
      var haystack = row.getAttribute("data-haystack") || "";
      var shown = parts.every(function (part) { return !part || haystack.indexOf(part) >= 0; });
      row.parentNode.hidden = !shown;
      if (shown) { if (row.getAttribute("data-cross") === "true") { extra++; } else { local++; } }
      if (row.getAttribute("data-row") === selected) { row.setAttribute("aria-current", "true"); }
      else { row.removeAttribute("aria-current"); }
    });
    var list = document.getElementById("library-list");
    if (list) {
      Array.from(list.children).sort(function (a, b) {
        function rank(item) {
          var id = item.firstElementChild.getAttribute("data-id").toLowerCase();
          var name = id.slice(id.lastIndexOf(".") + 1);
          return !query ? 2 : id === query || name === query ? 0 : id.indexOf(query) === 0 || name.indexOf(query) === 0 ? 1 : 2;
        }
        return rank(a) - rank(b) || a.firstElementChild.getAttribute("data-id").localeCompare(b.firstElementChild.getAttribute("data-id"));
      }).forEach(function (item) { list.appendChild(item); });
    }
    var empty = document.getElementById("library-empty");
    if (empty) { empty.hidden = local + extra > 0; }
    var group = document.getElementById("library-extra");
    if (group) { group.hidden = extra === 0; }
    document.getElementById("library-count").textContent = state.countTemplate.split("{0}").join(String(local)).split("{1}").join(String(state.localTotal));
    persist();
  }
  searchInput.addEventListener("input", function () { apply(); post({ type: "search", query: searchInput.value }); });
  networkInput.addEventListener("change", function () { networkToken = Date.now() + "-" + (++networkSequence); post({ type: "networkSearch", enabled: networkInput.checked, token: networkToken }); });
  document.addEventListener("click", function (event) {
    var target = event.target.closest && event.target.closest("[data-action], [data-row]");
    if (!target) { return; }
    var action = target.getAttribute("data-action");
    if (action === "clear") { searchInput.value = ""; searchInput.focus(); apply(); post({ type: "search", query: "" }); return; }
    if (action) { post({ type: action }); return; }
    selected = target.getAttribute("data-row"); apply(); post({ type: "open", id: selected });
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && event.target === searchInput) {
      searchInput.value = ""; apply(); post({ type: "search", query: "" });
    }
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") { return; }
    var rows = Array.from(document.querySelectorAll("[data-row]")).filter(function (row) { return !row.parentNode.hidden; });
    if (!rows.length || (event.target !== searchInput && !event.target.hasAttribute("data-row"))) { return; }
    event.preventDefault();
    var index = rows.indexOf(document.activeElement);
    var next = event.key === "ArrowDown" ? Math.min(rows.length - 1, index + 1) : Math.max(0, index - 1);
    rows[next].focus();
  });
  window.addEventListener("scroll", persist);
  window.addEventListener("message", function (event) {
    var payload = event.data;
    if (payload && payload.type === "networkSearchSaved") { if (payload.token === networkToken) { networkToken = undefined; networkInput.checked = payload.enabled; } return; }
    if (!payload || payload.type !== "libraryUpdate") { return; }
    var scroll = window.scrollY;
    var focused = document.activeElement && document.activeElement.getAttribute("data-row");
    var details = document.querySelector("footer details");
    var expanded = details && details.open;
    var doc = new DOMParser().parseFromString(payload.html, "text/html");
    ["library-results", "library-footer"].forEach(function (id) {
      var old = document.getElementById(id); var next = doc.getElementById(id);
      if (old && next) { old.replaceWith(next); }
    });
    state = payload.state;
    if (state.selectedKey) { selected = state.selectedKey; }
    if (!networkToken) { networkInput.checked = payload.networkSearch; }
    apply();
    var nextDetails = document.querySelector("footer details"); if (nextDetails) { nextDetails.open = expanded; }
    if (focused) { Array.from(document.querySelectorAll("[data-row]")).some(function (row) { if (row.getAttribute("data-row") === focused) { row.focus(); return true; } return false; }); }
    window.scrollTo(0, scroll);
  });
  apply();
  window.scrollTo(0, saved.scroll || 0);
  post({ type: "mounted" });
  post({ type: "search", query: searchInput.value });
})();
</script>
</body>
</html>
